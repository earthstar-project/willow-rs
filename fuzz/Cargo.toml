[package]
name = "willow_fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
willow_data_model_generic = { path = "../willow_data_model_generic", features = [
    "dev",
] }
pollster = "0.4.0"
