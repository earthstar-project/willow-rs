[package]
name = "willow25"
version = "0.1.0"
edition = "2024"

[features]
dev = ["dep:arbitrary"]

[dependencies]
willow25_macros = { path = "../willow25_macros", version = "0.1.0" }
willow_data_model = { path = "../willow_data_model", version = "0.4.0" }

# Dependencies when enabling the `dev` feature:
arbitrary = { version = "1.0.2", features = ["derive"], optional = true }

[lints]
workspace = true
